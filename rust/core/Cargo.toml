[package]
name = "s4ccm-core"
version = "1.4.0"
edition = "2021"

[lib]
name = "s4ccm_core"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
regex = "1"
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico"] }
jpeg-encoder = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
encoding_rs = "0.8"
trash = "5"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2"
parking_lot = "0.12"
memchr = "2"
rayon = "1"
winreg = "0.52"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
sha2 = "0.10"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation", "Win32_Storage_FileSystem"] }
